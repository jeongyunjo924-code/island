<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>무인도 생존 식량 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ocean:#173F42;
    --ocean-deep:#0F2E30;
    --sand:#EFE3C4;
    --sand-dark:#DCC998;
    --leaf:#4C6B43;
    --wood:#8B6A46;
    --coral:#E2734F;
    --ink:#26221C;
    --paper:#FBF6E9;
    --line: rgba(38,34,28,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1E2A26;
      --ink:#EDE6D6;
      --line: rgba(237,230,214,0.2);
      --sand-dark:#3A4A3E;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1E2A26;
    --ink:#EDE6D6;
    --line: rgba(237,230,214,0.2);
    --sand-dark:#3A4A3E;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,0.05), transparent 40%),
      linear-gradient(180deg, var(--ocean) 0%, var(--ocean-deep) 100%);
    font-family:'Nunito', system-ui, sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding: 28px 16px 60px;
  }
  h1,h2,h3,.display{ font-family:'Baloo 2', system-ui, sans-serif; }

  .app{
    width:100%;
    max-width:460px;
  }

  .brand{
    text-align:center;
    color:var(--sand);
    margin-bottom:22px;
  }
  .brand .mark{
    font-size:34px;
    display:block;
    margin-bottom:2px;
  }
  .brand h1{
    font-size:22px;
    margin:0;
    letter-spacing:0.2px;
    color:var(--sand);
  }
  .brand p{
    margin:6px 0 0;
    font-size:13px;
    color: rgba(239,227,196,0.75);
  }

  .panel{
    background:var(--paper);
    border-radius:22px;
    padding:26px 22px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.28);
    border: 1px solid rgba(0,0,0,0.06);
  }

  .role-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
  }
  .role-btn{
    border:2px solid var(--line);
    background:transparent;
    border-radius:16px;
    padding:22px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    cursor:pointer;
    color:var(--ink);
    font-family:'Baloo 2', sans-serif;
    font-size:15px;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .role-btn .ico{ font-size:30px; }
  .role-btn:hover{ border-color:var(--coral); background: rgba(226,115,79,0.06); }
  .role-btn:active{ transform: scale(0.97); }

  label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin: 16px 0 6px;
    color:var(--ink);
  }
  label.first{ margin-top:0; }
  .hint{
    font-size:12px;
    color: rgba(38,34,28,0.6);
    margin-top:4px;
    line-height:1.5;
  }
  input[type="text"], textarea{
    width:100%;
    font-family:'Nunito', sans-serif;
    font-size:15px;
    padding:12px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background: rgba(255,255,255,0.5);
    color:var(--ink);
    outline:none;
  }
  :root[data-theme="dark"] input[type="text"], :root[data-theme="dark"] textarea{ background: rgba(0,0,0,0.18); }
  input[type="text"]:focus, textarea:focus{ border-color: var(--coral); }
  textarea{ min-height:110px; resize:vertical; line-height:1.6; }

  .btn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:14px 16px;
    font-family:'Baloo 2', sans-serif;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    margin-top:18px;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{ background: var(--coral); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.05); }
  .btn-ghost{
    background:transparent;
    border:1.5px solid var(--line);
    color:var(--ink);
  }
  .btn-secondary{ background: var(--leaf); color:#fff; }
  .btn[disabled]{ opacity:0.5; cursor:not-allowed; }

  .back{
    background:none; border:none; color: rgba(239,227,196,0.85);
    font-family:'Nunito', sans-serif; font-size:13px; cursor:pointer;
    margin-bottom:12px; padding:6px 2px; display:inline-flex; align-items:center; gap:4px;
  }
  .back:hover{ color:#fff; }

  .error-box{
    background: rgba(226,115,79,0.12);
    border:1px solid rgba(226,115,79,0.4);
    color: var(--coral);
    font-size:13px;
    padding:10px 12px;
    border-radius:10px;
    margin-top:14px;
    line-height:1.5;
    display:none;
  }
  .error-box.show{ display:block; }

  .code-display{
    background: var(--sand-dark);
    border-radius:14px;
    padding:16px;
    text-align:center;
    margin: 6px 0 4px;
  }
  .code-display .label{ font-size:12px; color: rgba(38,34,28,0.65); margin-bottom:4px; }
  .code-display .code{ font-family:'Baloo 2', sans-serif; font-size:26px; letter-spacing:1px; }

  .status-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:13px; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);
  }
  .status-row b{ font-family:'Baloo 2', sans-serif; font-size:15px; }

  details{ margin-top:16px; }
  summary{
    cursor:pointer; font-size:13px; font-weight:700; color: var(--ocean);
    padding:4px 0;
  }
  :root[data-theme="dark"] summary{ color: var(--sand); }
  .roster-list{
    margin-top:10px; max-height:220px; overflow-y:auto;
    border:1px solid var(--line); border-radius:10px;
  }
  .roster-row{
    display:flex; justify-content:space-between; gap:10px;
    padding:8px 12px; font-size:13px; border-bottom:1px solid var(--line);
  }
  .roster-row:last-child{ border-bottom:none; }
  .roster-row span:first-child{ font-weight:700; }
  .roster-row span:last-child{ color: rgba(38,34,28,0.65); }

  /* student card */
  .stage{
    text-align:center;
  }
  .privacy-tip{
    font-size:12.5px;
    color: rgba(38,34,28,0.6);
    background: rgba(0,0,0,0.04);
    border-radius:10px;
    padding:8px 12px;
    margin-bottom:16px;
    line-height:1.5;
  }
  .ticket{
    position:relative;
    background: var(--paper);
    border: 2px dashed var(--wood);
    border-radius:18px;
    padding:30px 20px 26px;
    max-width:280px;
    margin: 0 auto;
  }
  .ticket .stub-label{
    font-size:11px;
    letter-spacing:0.5px;
    color: var(--wood);
    font-weight:700;
    margin-bottom:10px;
  }
  .ticket .icon{
    font-size:64px;
    margin: 6px 0 14px;
    line-height:1;
  }
  .ticket .icon-img{
    width:120px;
    height:120px;
    object-fit:contain;
    margin: 6px 0 14px;
  }
  .ticket .food-name{
    font-family:'Baloo 2', sans-serif;
    font-size:22px;
    font-weight:700;
    color: var(--ink);
    margin:0;
  }
  .ticket .owner{
    margin-top:10px;
    font-size:13px;
    color: rgba(38,34,28,0.6);
  }
  .hidden-card{
    max-width:280px;
    margin:0 auto;
    border-radius:18px;
    border: 2px solid var(--line);
    padding: 46px 20px;
    background: rgba(0,0,0,0.03);
  }
  .hidden-card .lock{ font-size:40px; margin-bottom:10px; }
  .hidden-card p{ font-size:13px; color: rgba(38,34,28,0.65); margin:0; }

  .spinner{
    width:22px; height:22px; border-radius:50%;
    border: 3px solid rgba(38,34,28,0.15); border-top-color: var(--coral);
    animation: spin 0.8s linear infinite;
    margin: 10px auto;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .foot-note{
    text-align:center; font-size:11.5px; color: rgba(239,227,196,0.5);
    margin-top:18px;
  }
</style>
</head>
<body>

  <div class="brand">
    <span class="mark">🏝️</span>
    <h1>무인도 생존 식량 카드</h1>
    <p>모둠 회의를 시작하기 전, 나만의 식량을 확인해보세요</p>
  </div>

  <div class="panel" id="panel">
    <!-- JS로 화면 전환 -->
  </div>
  <div class="foot-note" id="footNote"></div>
</div>

  function iconFor(name){
    for(var i=0;i<ICON_MAP.length;i++){
      var keys = ICON_MAP[i][0];
      for(var j=0;j<keys.length;j++){
        if(name.indexOf(keys[j]) !== -1) return ICON_MAP[i][1];
      }
    }
    return "🍽️";
  }

  // ---------- 유틸 ----------
  function normCode(s){ return (s||"").trim().replace(/\s+/g,"").toLowerCase(); }
  function normName(s){ return (s||"").trim().replace(/\s+/g," "); }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function parseLines(text){
    return text.split("\n").map(function(s){ return normName(s); }).filter(Boolean);
  }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function render(view, data){

  var tapCount = 0, tapTimer = null;
  function registerSecretTap(){
    var mark = document.querySelector('.brand .mark');
    if(!mark) return;
    mark.style.cursor = 'default';
    mark.onclick = function(){
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(function(){ tapCount = 0; }, 2500);
      if(tapCount >= 5){
        tapCount = 0;
        location.hash = 'teacher';
        render('teacher-setup');
      }
    };
  }

  function renderTeacherSetup(){
    panel.innerHTML =
      '<button class="back" id="btnBack">← 학생 화면으로</button>' +

      '<p class="hint" style="margin-top:2px;">아래 목록을 등록하면 학생마다 겹치지 않는 식량 카드가 자동으로 배정돼요.</p>' +

      '<label class="first">식량 목록 (한 줄에 하나씩, 최소 학생 수만큼)</label>' +
      '<textarea id="foodList">' + DEFAULT_FOODS.join("\n") + '</textarea>' +
      '<p class="hint">활동지에 있던 30개 식량 카드가 기본으로 채워져 있어요. 자유롭게 추가·삭제·수정해도 돼요. 각 식량은 학생 한 명에게만 배정됩니다. <b>단, "바나나"는 목록에서 빠지면 안 되고, 반드시 학생 1명에게 배정돼요.</b></p>' +

      '<label>학생 이름 목록 (한 줄에 한 명씩)</label>' +
      '<textarea id="studentList" placeholder="김하늘&#10;이도윤&#10;박서연&#10;..."></textarea>' +
      '<p class="hint">학생들은 학생 화면에서 여기 적은 이름과 <b>정확히 같은 이름</b>을 입력해야 카드가 열려요.</p>' +

      '<div class="error-box" id="errBox"></div>' +
      '<button class="btn btn-primary" id="btnGenerate">식량 카드 배정하기</button>';

    document.getElementById('btnBack').onclick = function(){ location.hash=''; render('student-login'); };
    document.getElementById('btnGenerate').onclick = onGenerate;
  }

  async function onGenerate(){
    var errBox = document.getElementById('errBox');
    errBox.classList.remove('show');

    var foods = Array.from(new Set(parseLines(document.getElementById('foodList').value)));
    var students = parseLines(document.getElementById('studentList').value);
    var uniqueStudents = Array.from(new Set(students));

    if(uniqueStudents.length !== students.length){
      showErr("학생 이름 목록에 중복된 이름이 있어요. 이름을 구분할 수 있게 (예: 김하늘1 / 김하늘2) 수정해주세요."); return;
    }
    if(students.length === 0){
      showErr("학생 이름을 한 명 이상 입력해주세요."); return;
    }
    if(foods.length < students.length){
      showErr("식량 종류(" + foods.length + "개)가 학생 수(" + students.length + "명)보다 적어요. 식량을 더 추가해주세요."); return;
    }
    if(foods.indexOf(FORCED_FOOD) === -1){
      showErr("'" + FORCED_FOOD + "'가 식량 목록에 반드시 포함되어야 해요. 목록에 '" + FORCED_FOOD + "'를 추가해주세요."); return;
    }
    if(!db){
      showErr("실시간 저장 기능을 불러오지 못했어요. 잠시 후 다시 시도해주세요."); return;
    }

    var btn = document.getElementById('btnGenerate');
    btn.disabled = true; btn.textContent = "배정 중...";

    var shuffledFoods;
    if(foods.length > students.length){
      // 바나나를 반드시 배정 목록에 포함시키고, 나머지 자리를 무작위로 채운 뒤 다시 섞는다
      var restFoods = foods.filter(function(f){ return f !== FORCED_FOOD; });
      var pickedRest = shuffle(restFoods).slice(0, students.length - 1);
      shuffledFoods = shuffle(pickedRest.concat([FORCED_FOOD]));
    } else {
      // 학생 수만큼만 식량이 있는 경우 전체가 그대로 배정되므로 바나나도 자동 포함됨
      shuffledFoods = shuffle(foods).slice(0, students.length);
    }
    var assignment = {};
    students.forEach(function(name, i){ assignment[name] = shuffledFoods[i]; });

    var sessionDoc = {
      foods: foods,
      students: students,
      assignment: assignment,
      createdAt: Date.now()
    };

    try{
      await db.doc(SESSION_DOC).set(sessionDoc);
      render('teacher-done', sessionDoc);
    }catch(e){
      showErr("저장 중 문제가 발생했어요. 다시 시도해주세요.");
      btn.disabled = false; btn.textContent = "식량 카드 배정하기";
    }

    function showErr(msg){
      errBox.textContent = msg;
      errBox.classList.add('show');
    }
  }

  function renderTeacherDone(sessionDoc){
    var rows = sessionDoc.students.map(function(name){
      return '<div class="roster-row"><span>'+esc(name)+'</span><span>'+esc(sessionDoc.assignment[name])+'</span></div>';
    }).join('');

    panel.innerHTML =
      '<button class="back" id="btnBack">← 학생 화면으로</button>' +
      '<h2 style="margin:4px 0 2px;font-size:19px;">✅ 배정 완료</h2>' +
      '<p class="hint" style="margin-top:2px;">이제 학생들은 각자 태블릿에서 이 링크에 접속해 자기 이름만 입력하면 자신의 식량 카드를 확인할 수 있어요.</p>' +
      '<div class="status-row" style="border-top:none;padding-top:0;"><span>배정된 학생 수</span><b>'+sessionDoc.students.length+'명</b></div>' +
      '<div class="status-row"><span>등록된 식량 종류</span><b>'+sessionDoc.foods.length+'개</b></div>' +
      '<details><summary>🔒 선생님용 전체 배정 확인</summary><div class="roster-list">'+rows+'</div></details>' +
      '<button class="btn btn-ghost" id="btnNew">새로 배정하기</button>' +
      '<p class="hint" style="text-align:center;margin-top:14px;">다시 이 화면으로 오려면 로고를 5번 연속 탭하세요.</p>';

    document.getElementById('btnBack').onclick = function(){ location.hash=''; render('student-login'); };
    document.getElementById('btnNew').onclick = function(){ render('teacher-setup'); };
  }

  function renderStudentLogin(prefill){
    prefill = prefill || {};
    panel.innerHTML =
      '<h2 style="margin:4px 0 2px;font-size:19px;">내 식량 카드 확인</h2>' +
      '<p class="hint" style="margin-top:2px;">선생님께 등록된 내 이름을 그대로 입력하세요.</p>' +
      '<label class="first">내 이름</label>' +
      '<input type="text" id="inName" placeholder="예: 김하늘" value="'+esc(prefill.name||'')+'">' +
      '<div class="error-box" id="errBox2"></div>' +
      '<button class="btn btn-primary" id="btnFind">내 카드 찾기</button>';

    registerSecretTap();
    document.getElementById('btnFind').onclick = onFind;
    document.getElementById('inName').addEventListener('keydown', function(e){ if(e.key==='Enter') onFind(); });
  }

  async function onFind(){
    var errBox = document.getElementById('errBox2');
    errBox.classList.remove('show');
    var name = normName(document.getElementById('inName').value);

    if(!name){
      errBox.textContent = "이름을 입력해주세요.";
      errBox.classList.add('show');
      return;
    }
    if(!db){
      errBox.textContent = "실시간 저장 기능을 불러오지 못했어요. 잠시 후 다시 시도해주세요.";
      errBox.classList.add('show');
      return;
    }

    var btn = document.getElementById('btnFind');
    btn.disabled = true; btn.textContent = "찾는 중...";

    try{
      var res = await db.doc(SESSION_DOC).get();
      var sessionDoc = res && res.data;
      if(!sessionDoc){
        errBox.textContent = "아직 선생님이 식량 카드를 준비하지 않았어요. 선생님께 확인해주세요.";
        errBox.classList.add('show');
        btn.disabled = false; btn.textContent = "내 카드 찾기";
        return;
      }
      var food = sessionDoc.assignment ? sessionDoc.assignment[name] : null;
      if(!food){
        errBox.textContent = "이 이름으로 등록된 카드를 찾을 수 없어요. 선생님이 등록한 이름과 똑같이 입력했는지 확인해주세요.";
        errBox.classList.add('show');
        btn.disabled = false; btn.textContent = "내 카드 찾기";
        return;
      }
      render('student-card', { name: name, food: food });
    }catch(e){
      errBox.textContent = "확인 중 문제가 발생했어요. 다시 시도해주세요.";
      errBox.classList.add('show');
      btn.disabled = false; btn.textContent = "내 카드 찾기";
    }
  }

  function renderStudentCard(data){
    panel.innerHTML =
      '<button class="back" id="btnBack">← 다시 입력하기</button>' +
      '<div class="stage">' +
        '<p class="privacy-tip">📵 다른 친구가 볼 수 없도록 화면을 손이나 팔로 가려주세요.</p>' +
        '<div id="cardArea"></div>' +
      '</div>';
    document.getElementById('btnBack').onclick = function(){ location.hash=''; render('student-login', data); };

    var cardArea = document.getElementById('cardArea');
    var revealed = false;

    function showHidden(){
      cardArea.innerHTML =
        '<div class="hidden-card">' +
          '<div class="lock">🔒</div>' +
          '<p>준비되면 버튼을 눌러<br>내 식량 카드를 확인하세요</p>' +
        '</div>' +
        '<button class="btn btn-secondary" id="btnReveal">내 카드 확인하기</button>';
      document.getElementById('btnReveal').onclick = function(){ revealed = true; showTicket(); };
    }

    function showTicket(){
      var img = FOOD_IMAGES[data.food];
      var visual = img
        ? '<img class="icon-img" src="'+img+'" alt="'+esc(data.food)+'">'
        : '<div class="icon">'+iconFor(data.food)+'</div>';
      cardArea.innerHTML =
        '<div class="ticket">' +
          '<div class="stub-label">MY SURVIVAL RATION</div>' +
          visual +
          '<p class="food-name">'+esc(data.food)+'</p>' +
          '<div class="owner">'+esc(data.name)+' 님의 식량</div>' +
        '</div>' +
        '<button class="btn btn-ghost" id="btnHide">다시 숨기기</button>';
      document.getElementById('btnHide').onclick = function(){ revealed=false; showHidden(); };
    }

    showHidden();
  }

  // ---------- 시작 ----------
  function initialView(){
    return (location.hash === '#teacher') ? 'teacher-setup' : 'student-login';
  }
  render(initialView()); // db 로딩 전에도 화면은 즉시 표시
  dbReady.then(function(){ /* db 준비 완료, 이미 그려진 화면은 그대로 둠 */ });
})();
</script>
</body>
</html>
